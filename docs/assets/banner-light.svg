<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="model-relay: multi-provider router and cache-safe 429 failover for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0f172a" opacity="0.08"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lane1 { animation: l1 9s ease-in-out infinite; }
      .lane2 { animation: l2 9s ease-in-out infinite; }
      .lane3 { animation: l3 9s ease-in-out infinite; }
      @keyframes l1 { 0%, 30% { opacity: 1; } 34%, 95% { opacity: 0.32; } 100% { opacity: 1; } }
      @keyframes l2 { 0%, 30% { opacity: 0.32; } 35%, 65% { opacity: 1; } 70%, 100% { opacity: 0.32; } }
      @keyframes l3 { 0%, 65% { opacity: 0.32; } 70%, 95% { opacity: 1; } 100% { opacity: 0.32; } }
      .dash { stroke-dasharray: 7 6; animation: d 1.4s linear infinite; }
      @keyframes d { to { stroke-dashoffset: -26; } }
      .ring { animation: r 4.5s ease-in-out infinite; transform-origin: 214px 180px; }
      @keyframes r { 0%, 100% { opacity: 0.3; transform: scale(0.96); } 50% { opacity: 0.85; transform: scale(1.04); } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="250" cy="180" r="210" fill="url(#halo)"/>

  <g transform="translate(52 44)">
    <rect x="0" y="76" width="116" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="18" cy="94" r="4" fill="#ef4444"/>
    <circle cx="31" cy="94" r="4" fill="#f59e0b"/>
    <circle cx="44" cy="94" r="4" fill="#10b981"/>
    <text x="16" y="122" class="mono" font-size="11" fill="#0284c7">&gt; /provider</text>
    <rect x="16" y="134" width="84" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="16" y="148" width="66" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="16" y="166" width="84" height="18" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="58" y="179" text-anchor="middle" class="mono" font-size="10" fill="#0369a1">620k cache</text>

    <line x1="116" y1="136" x2="156" y2="136" stroke="url(#accent)" stroke-width="3" class="dash"/>

    <circle cx="192" cy="136" r="44" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4" class="ring"/>
    <rect x="156" y="100" width="72" height="72" rx="20" fill="#ffffff" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="192" y="132" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0f172a">RELAY</text>
    <text x="192" y="150" text-anchor="middle" class="mono" font-size="11" fill="#0284c7">:8950</text>

    <path d="M228 124 C 258 124, 260 46, 292 46" fill="none" stroke="#0284c7" stroke-width="2.5" class="lane1 dash"/>
    <path d="M228 136 L 292 136" fill="none" stroke="#6366f1" stroke-width="2.5" class="lane2 dash"/>
    <path d="M228 148 C 258 148, 260 226, 292 226" fill="none" stroke="#059669" stroke-width="2.5" class="lane3 dash"/>

    <g class="lane1">
      <rect x="292" y="14" width="168" height="64" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="314" cy="38" r="5" fill="#0284c7"/>
      <text x="328" y="43" class="mono" font-size="14" font-weight="700" fill="#0f172a">Claude Opus</text>
      <text x="310" y="64" class="mono" font-size="11" fill="#475569">Main · OAuth intact</text>
    </g>

    <g class="lane2">
      <rect x="292" y="104" width="168" height="64" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
      <circle cx="314" cy="128" r="5" fill="#6366f1"/>
      <text x="328" y="133" class="mono" font-size="14" font-weight="700" fill="#0f172a">Backup [1m]</text>
      <text x="310" y="154" class="mono" font-size="11" fill="#4f46e5">429 Failover · Haiku</text>
    </g>

    <g class="lane3">
      <rect x="292" y="194" width="168" height="64" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <circle cx="314" cy="218" r="5" fill="#059669"/>
      <text x="328" y="223" class="mono" font-size="14" font-weight="700" fill="#0f172a">Fast model</text>
      <text x="310" y="244" class="mono" font-size="11" fill="#047857">Pinned · 200 · 1.8s</text>
    </g>
  </g>

  <text x="556" y="138" class="mono" font-size="82" font-weight="700" fill="#0f172a" letter-spacing="-2">model<tspan fill="url(#accent)">-</tspan>relay</text>
  <text x="560" y="190" class="sans" font-size="27" font-weight="600" fill="#1e293b">Multi-provider router &amp; cache-safe failover for Claude Code</text>
  <text x="560" y="230" class="sans" font-size="19" fill="#475569">Switch any window with /provider · Survive 429 limits without rebuilding 800k caches</text>

  <g transform="translate(560 254)">
    <rect x="0" y="0" width="148" height="32" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="74" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#0369a1">AbovePrompt UI</text>

    <rect x="160" y="0" width="166" height="32" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="243" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#4338ca">Sticky 429 Failover</text>

    <rect x="338" y="0" width="160" height="32" rx="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="418" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#047857">Subagent Offload</text>

    <rect x="510" y="0" width="144" height="32" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="582" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#b45309">6 Built-in Presets</text>
  </g>
</svg>
