<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="Animation: a Claude Code session hits a 429 usage limit; model-relay seamlessly fails over to the backup provider and pins that window while new windows return to Claude after cooldown">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .t { fill: #e2e8f0; font-size: 14px; }
      .m { fill: #94a3b8; font-size: 12.5px; }
      .s1 { animation: s1 12s linear infinite; } @keyframes s1 { 0%, 100% { opacity: 1; } }
      .s2 { animation: s2 12s linear infinite; } @keyframes s2 { 0%, 18% { opacity: 0; } 22%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .s3 { animation: s3 12s linear infinite; } @keyframes s3 { 0%, 34% { opacity: 0; } 38%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .s4 { animation: s4 12s linear infinite; } @keyframes s4 { 0%, 52% { opacity: 0; } 56%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .s5 { animation: s5 12s linear infinite; } @keyframes s5 { 0%, 70% { opacity: 0; } 74%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .st0 { animation: st0 12s linear infinite; } @keyframes st0 { 0%, 34% { opacity: 1; } 36%, 100% { opacity: 0; } }
      .st1 { animation: st1 12s linear infinite; } @keyframes st1 { 0%, 35% { opacity: 0; } 38%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="410" rx="18" fill="#0d1117"/>

  <!-- Left Window: Session #1 -->
  <rect x="24" y="24" width="444" height="362" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="46" cy="46" r="5" fill="#f87171"/>
  <circle cx="64" cy="46" r="5" fill="#fbbf24"/>
  <circle cx="82" cy="46" r="5" fill="#4ade80"/>
  <text x="246" y="51" text-anchor="middle" class="sans m">Terminal 1 · Active coding session</text>

  <g class="s1">
    <text x="44" y="92" class="mono t"><tspan fill="#38bdf8">›</tspan> implement the multi-provider router</text>
    <text x="44" y="118" class="mono m">  Claude Opus: Edited router/logic.js · 12/12 tests pass</text>
  </g>

  <g class="s2">
    <text x="44" y="156" class="mono t"><tspan fill="#38bdf8">›</tspan> now wire the AbovePrompt panel</text>
    <rect x="44" y="170" width="404" height="34" rx="8" fill="#2a1519" stroke="#f87171" stroke-width="1"/>
    <text x="58" y="192" class="mono" font-size="13" fill="#fca5a5">⚡ Anthropic HTTP 429: 5-hour usage limit reached</text>
  </g>

  <g class="s3">
    <rect x="44" y="216" width="404" height="58" rx="8" fill="#172033" stroke="#818cf8" stroke-width="1.5"/>
    <text x="58" y="238" class="mono" font-size="13" fill="#c4b5fd">⇄ model-relay: failover → backup (backup-9[1m])</text>
    <text x="58" y="258" class="sans m">Session #1 pinned (Sticky) · ToolSearch keeps working</text>
  </g>

  <g class="s4">
    <text x="44" y="302" class="mono t"><tspan fill="#4ade80">✓</tspan> Backup: Created hooks/panel.tsx · Validation passed</text>
    <text x="44" y="326" class="sans m">  Zero interruption — your turn completed in the same request.</text>
  </g>

  <!-- Status bar at bottom of Terminal 1 -->
  <rect x="25" y="350" width="442" height="35" rx="10" fill="#0d1117"/>
  <text x="44" y="372" class="mono m st0"><tspan fill="#38bdf8">●</tspan> claude · Anthropic Claude</text>
  <text x="44" y="372" class="mono m st1"><tspan fill="#a78bfa">●</tspan> pinned · backup-9[1m] (this window)</text>

  <!-- Right Column: What happens 10 minutes later when Claude quota recovers -->
  <rect x="492" y="24" width="444" height="172" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="514" cy="46" r="5" fill="#f87171"/>
  <circle cx="532" cy="46" r="5" fill="#fbbf24"/>
  <circle cx="550" cy="46" r="5" fill="#4ade80"/>
  <text x="714" y="51" text-anchor="middle" class="sans m">Terminal 2 · New session (after 10m cooldown)</text>

  <text x="514" y="88" class="sans" font-size="15" font-weight="600" fill="#7dd3fc">New sessions automatically return to Claude</text>
  <text x="514" y="114" class="sans m">After cooldownMs (10m), the next new conversation probes</text>
  <text x="514" y="134" class="sans m">Anthropic. Once HTTP 200 returns, new sessions use Claude:</text>
  <g class="s5">
    <rect x="514" y="148" width="400" height="32" rx="7" fill="#0f2922" stroke="#34d399" stroke-width="1"/>
    <text x="528" y="169" class="mono" font-size="12.5" fill="#6ee7b7">✓ Probe 200 OK → Terminal 2 routes to Claude Opus</text>
  </g>

  <!-- Bottom Right Card: Per-Window Session Isolation -->
  <rect x="492" y="214" width="444" height="172" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="514" y="244" class="sans" font-size="15" font-weight="600" fill="#e2e8f0">Per-window routing (x-claude-code-session-id)</text>
  <text x="514" y="270" class="sans m">Every Claude Code window is tracked by its own session ID.</text>
  <text x="514" y="290" class="sans m">Switching or failing over in Terminal 1 never hijacks</text>
  <text x="514" y="310" class="sans m">Terminal 2, and full conversation &amp; tools stay intact.</text>

  <rect x="514" y="328" width="400" height="40" rx="8" fill="#172033" stroke="#30363d"/>
  <text x="528" y="353" class="mono" font-size="12.5" fill="#7dd3fc">⇄ Independent per window · Switch anytime with /provider</text>
</svg>
