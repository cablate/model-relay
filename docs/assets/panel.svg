<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Animation: on the left, main chat uses Claude while haiku subagents automatically route to the backup provider and a local gateway auto-launches; on the right, the interactive AbovePrompt panel lets you ping latency and switch providers with one click">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .t { fill: #e2e8f0; font-size: 13.5px; }
      .m { fill: #94a3b8; font-size: 12px; }
      .pingShow { animation: ps 10s linear infinite; }
      @keyframes ps { 0%, 24% { opacity: 0; } 28%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .press { animation: pr 10s linear infinite; }
      @keyframes pr { 0%, 44% { opacity: 0; } 46%, 54% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .panelOut { animation: po 10s linear infinite; }
      @keyframes po { 0%, 54% { opacity: 1; } 58%, 94% { opacity: 0; } 98%, 100% { opacity: 1; } }
      .toastIn { animation: ti 10s linear infinite; }
      @keyframes ti { 0%, 56% { opacity: 0; } 60%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="380" rx="18" fill="#0d1117"/>

  <text x="36" y="42" class="sans" font-size="16" font-weight="600" fill="#f8fafc">Offload subagents automatically, or switch any window from the interactive panel above your prompt.</text>
  <text x="36" y="64" class="sans m">Type /provider to open the panel: [Ping] tests every provider, [Use] switches only this window, then the panel closes.</text>

  <!-- Left Side: Subagent & Local Gateway Routing -->
  <g transform="translate(36 84)">
    <rect width="420" height="82" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="26" class="mono" font-size="13" font-weight="700" fill="#7dd3fc">1. Main Thread → Anthropic Claude</text>
    <text x="18" y="48" class="sans m">Keeps your Claude OAuth subscription &amp; prompt cache intact</text>
    <text x="18" y="66" class="mono m">model: claude-opus-5-5 → https://api.anthropic.com</text>

    <rect y="94" width="420" height="86" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="18" y="120" class="mono" font-size="13" font-weight="700" fill="#c4b5fd">2. Subagents (haiku / model-relay:*) → any provider</text>
    <text x="18" y="142" class="sans m">Route via /provider alias or subagent_type: "model-relay:backup"</text>
    <text x="18" y="162" class="mono m">Keeps ToolSearch working so tools never vanish</text>

    <rect y="192" width="420" height="82" rx="10" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="18" y="218" class="mono" font-size="13" font-weight="700" fill="#6ee7b7">3. Local Gateways → Auto-Launched &amp; Cleaned</text>
    <text x="18" y="240" class="sans m">Spawns local gateway if port is closed; strips cache_control</text>
    <text x="18" y="258" class="mono m">launch: { command: "my-gateway", args: ["serve"] }</text>
  </g>

  <g transform="translate(480 84)">
   <g class="panelOut">
    <rect width="444" height="244" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="2"/>
    <text x="18" y="28" class="mono" font-size="13"><tspan fill="#38bdf8" font-weight="700">model-relay</tspan><tspan fill="#8b949e" font-size="10.5"> · this window's model</tspan></text>
    <rect x="246" y="12" width="54" height="22" rx="5" fill="#1f6feb"/>
    <text x="273" y="27" text-anchor="middle" class="mono" font-size="11" fill="#ffffff">Ping [p]</text>
    <rect x="304" y="12" width="78" height="22" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="343" y="27" text-anchor="middle" class="mono" font-size="11" fill="#c9d1d9">Settings [s]</text>
    <rect x="386" y="12" width="42" height="22" rx="5" fill="#21262d"/>
    <text x="407" y="27" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">Close</text>
    <line x1="18" y1="46" x2="426" y2="46" stroke="#30363d"/>

    <g transform="translate(18 60)">
      <text x="0" y="16" class="mono" font-size="12.5"><tspan fill="#4ade80" font-weight="700">● </tspan><tspan x="16" fill="#f8fafc" font-weight="700">claude</tspan><tspan x="84" fill="#8b949e">Anthropic Claude</tspan></text>
      <text x="408" y="16" text-anchor="end" class="mono m">In use</text>
    </g>
    <g transform="translate(18 96)">
      <text x="0" y="16" class="mono" font-size="12.5"><tspan fill="#8b949e">○ </tspan><tspan x="16" fill="#c9d1d9">backup</tspan><tspan x="84" fill="#c9d1d9">backup-9</tspan><tspan class="pingShow" fill="#4ade80"> · test ok 1.9s</tspan></text>
      <rect x="344" y="0" width="64" height="22" rx="5" fill="#1f6feb"/>
      <text x="376" y="15" text-anchor="middle" class="mono" font-size="11" fill="#ffffff">Use [2]</text>
    </g>
    <g transform="translate(18 132)">
      <text x="0" y="16" class="mono" font-size="12.5"><tspan fill="#8b949e">○ </tspan><tspan x="16" fill="#c9d1d9">fast</tspan><tspan x="84" fill="#c9d1d9">fast-model</tspan><tspan class="pingShow" fill="#4ade80"> · test ok 1.4s</tspan></text>
      <rect x="344" y="0" width="64" height="22" rx="5" fill="#1f6feb"/>
      <rect class="press" x="341" y="-3" width="70" height="28" rx="7" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <text x="376" y="15" text-anchor="middle" class="mono" font-size="11" fill="#ffffff">Use [3]</text>
    </g>
    <g transform="translate(18 168)">
      <text x="0" y="16" class="mono" font-size="12.5"><tspan fill="#8b949e">○ </tspan><tspan x="16" fill="#c9d1d9">local</tspan><tspan x="84" fill="#c9d1d9">local-model</tspan><tspan class="pingShow" fill="#4ade80"> · test ok 1.1s</tspan></text>
      <rect x="344" y="0" width="64" height="22" rx="5" fill="#1f6feb"/>
      <text x="376" y="15" text-anchor="middle" class="mono" font-size="11" fill="#ffffff">Use [4]</text>
    </g>

    <line x1="18" y1="206" x2="426" y2="206" stroke="#30363d"/>
    <text x="18" y="226" class="sans m">Keyboard: ctrl+x tab, then the key shown on a button</text>
   </g>
   <g class="toastIn" transform="translate(0 84)">
    <rect width="444" height="84" rx="12" fill="#161b22" stroke="#4ade80" stroke-width="1.5"/>
    <text x="18" y="28" class="sans" font-size="14" font-weight="700" fill="#4ade80">✓ This window now uses fast (fast-model)</text>
    <text x="18" y="50" class="mono m">Status file: pinned  fast-model (for your statusline)</text>
    <text x="18" y="70" class="sans m">The panel closed by itself; /provider opens it again</text>
   </g>
  </g>
</svg>
