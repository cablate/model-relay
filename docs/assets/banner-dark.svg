<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="model-relay: per-window model switcher, subagent router, and 429 failover for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" opacity="0.12"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lane1 { animation: l1 9s ease-in-out infinite; }
      .lane2 { animation: l2 9s ease-in-out infinite; }
      .lane3 { animation: l3 9s ease-in-out infinite; }
      @keyframes l1 { 0%, 30% { opacity: 1; } 34%, 95% { opacity: 0.28; } 100% { opacity: 1; } }
      @keyframes l2 { 0%, 30% { opacity: 0.28; } 35%, 65% { opacity: 1; } 70%, 100% { opacity: 0.28; } }
      @keyframes l3 { 0%, 65% { opacity: 0.28; } 70%, 95% { opacity: 1; } 100% { opacity: 0.28; } }
      .dash { stroke-dasharray: 7 6; animation: d 1.4s linear infinite; }
      @keyframes d { to { stroke-dashoffset: -26; } }
      .ring { animation: r 4.5s ease-in-out infinite; transform-origin: 214px 180px; }
      @keyframes r { 0%, 100% { opacity: 0.35; transform: scale(0.96); } 50% { opacity: 0.9; transform: scale(1.04); } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="250" cy="180" r="210" fill="url(#halo)"/>

  <!-- Left Visual Switchboard -->
  <g transform="translate(52 44)">
    <!-- Terminal Mini Card -->
    <rect x="0" y="76" width="116" height="120" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="18" cy="94" r="4" fill="#f87171"/>
    <circle cx="31" cy="94" r="4" fill="#fbbf24"/>
    <circle cx="44" cy="94" r="4" fill="#4ade80"/>
    <text x="16" y="122" class="mono" font-size="11" fill="#38bdf8">&gt; /provider</text>
    <rect x="16" y="134" width="84" height="7" rx="3.5" fill="#334155"/>
    <rect x="16" y="148" width="66" height="7" rx="3.5" fill="#334155"/>
    <rect x="16" y="166" width="84" height="18" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="58" y="179" text-anchor="middle" class="mono" font-size="10" fill="#7dd3fc">per-window</text>

    <!-- Inflow Line -->
    <line x1="116" y1="136" x2="156" y2="136" stroke="url(#accent)" stroke-width="3" class="dash"/>

    <!-- Central Relay Hub -->
    <circle cx="192" cy="136" r="44" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4" class="ring"/>
    <rect x="156" y="100" width="72" height="72" rx="20" fill="url(#hubGrad)" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="192" y="132" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#e2e8f0">RELAY</text>
    <text x="192" y="150" text-anchor="middle" class="mono" font-size="11" fill="#38bdf8">:8950</text>

    <!-- Outflow Curves -->
    <path d="M228 124 C 258 124, 260 46, 292 46" fill="none" stroke="#38bdf8" stroke-width="2.5" class="lane1 dash"/>
    <path d="M228 136 L 292 136" fill="none" stroke="#a78bfa" stroke-width="2.5" class="lane2 dash"/>
    <path d="M228 148 C 258 148, 260 226, 292 226" fill="none" stroke="#34d399" stroke-width="2.5" class="lane3 dash"/>

    <!-- Provider Card 1: Claude -->
    <g class="lane1">
      <rect x="292" y="14" width="168" height="64" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="314" cy="38" r="5" fill="#38bdf8"/>
      <text x="328" y="43" class="mono" font-size="14" font-weight="700" fill="#f8fafc">Claude Opus</text>
      <text x="310" y="64" class="mono" font-size="11" fill="#94a3b8">Main · OAuth intact</text>
    </g>

    <!-- Provider Card 2: backup / local -->
    <g class="lane2">
      <rect x="292" y="104" width="168" height="64" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="314" cy="128" r="5" fill="#a78bfa"/>
      <text x="328" y="133" class="mono" font-size="14" font-weight="700" fill="#f8fafc">Backup [1m]</text>
      <text x="310" y="154" class="mono" font-size="11" fill="#c4b5fd">429 Failover · Haiku</text>
    </g>

    <!-- Provider Card 3: fast -->
    <g class="lane3">
      <rect x="292" y="194" width="168" height="64" rx="14" fill="#111827" stroke="#34d399" stroke-width="2"/>
      <circle cx="314" cy="218" r="5" fill="#34d399"/>
      <text x="328" y="223" class="mono" font-size="14" font-weight="700" fill="#f8fafc">Fast model</text>
      <text x="310" y="244" class="mono" font-size="11" fill="#6ee7b7">Pinned · 200 · 1.8s</text>
    </g>
  </g>

  <!-- Right Title & Value Proposition -->
  <text x="556" y="138" class="mono" font-size="82" font-weight="700" fill="#f8fafc" letter-spacing="-2">model<tspan fill="url(#accent)">-</tspan>relay</text>
  <text x="560" y="190" class="sans" font-size="27" font-weight="600" fill="#e2e8f0">Per-window model switcher &amp; subagent router for Claude Code</text>
  <text x="560" y="230" class="sans" font-size="19" fill="#94a3b8">Switch any window with /provider · Route subagents · Auto-failover on 429 limits</text>

  <!-- Feature Pills -->
  <g transform="translate(560 254)">
    <rect x="0" y="0" width="148" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="74" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#7dd3fc">/provider Panel</text>

    <rect x="160" y="0" width="166" height="32" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="243" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#c4b5fd">Subagent Routing</text>

    <rect x="338" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="418" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#6ee7b7">429 Auto-Failover</text>

    <rect x="510" y="0" width="144" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="582" y="21" text-anchor="middle" class="mono" font-size="12.5" fill="#fde68a">Remote Control</text>
  </g>
</svg>
